openapi: 3.1.0
info:
  title: OpenCode WebUI Contracts
  version: 0.1.0
  description: |-
    OpenCode WebUI client-facing contract for connecting to OpenCode Server.
    This specification models the endpoints used by the frontend.
servers:
  - url: http://localhost:4096
    description: Local OpenCode Server
paths:
  /session:
    get:
      summary: List sessions
      responses:
        '200':
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
    post:
      summary: Create session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parentID:
                  type: string
                title:
                  type: string
      responses:
        '200':
          description: Created session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
  /session/{id}:
    get:
      summary: Get session detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
  /session/{id}/message:
    get:
      summary: List messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Messages list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageEnvelope'
    post:
      summary: Send message (sync)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: Message response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
  /event:
    get:
      summary: Server event stream (SSE)
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
  /pty/{id}/connect:
    get:
      summary: PTY WebSocket connection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '101':
          description: Switching Protocols (WebSocket)
components:
  schemas:
    Session:
      type: object
      properties:
        id:
          type: string
        projectID:
          type: string
        directory:
          type: string
        parentID:
          type: string
        title:
          type: string
        version:
          type: string
        time:
          type: object
          properties:
            created:
              type: number
            updated:
              type: number
    Message:
      type: object
      properties:
        id:
          type: string
        sessionID:
          type: string
        role:
          type: string
          enum: [user, assistant, system]
        time:
          type: object
          properties:
            created:
              type: number
            completed:
              type: number
    MessageEnvelope:
      type: object
      properties:
        info:
          $ref: '#/components/schemas/Message'
        parts:
          type: array
          items:
            $ref: '#/components/schemas/Part'
    Part:
      oneOf:
        - $ref: '#/components/schemas/TextPart'
        - $ref: '#/components/schemas/FilePart'
        - $ref: '#/components/schemas/ToolPart'
        - $ref: '#/components/schemas/StepStartPart'
        - $ref: '#/components/schemas/StepFinishPart'
    TextPart:
      type: object
      properties:
        type:
          type: string
          enum: [text]
        text:
          type: string
    FilePart:
      type: object
      properties:
        type:
          type: string
          enum: [file]
        url:
          type: string
        mime:
          type: string
        filename:
          type: string
    ToolPart:
      type: object
      properties:
        type:
          type: string
          enum: [tool]
        tool:
          type: string
        state:
          type: object
    StepStartPart:
      type: object
      properties:
        type:
          type: string
          enum: [step-start]
        text:
          type: string
    StepFinishPart:
      type: object
      properties:
        type:
          type: string
          enum: [step-finish]
        text:
          type: string
    SendMessageRequest:
      type: object
      properties:
        messageID:
          type: string
        providerID:
          type: string
        modelID:
          type: string
        mode:
          type: string
        parts:
          type: array
          items:
            $ref: '#/components/schemas/UserMessagePart'
    UserMessagePart:
      type: object
      properties:
        type:
          type: string
          enum: [text]
        text:
          type: string
